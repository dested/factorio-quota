scenario-name=QUOTA: The Factory Must Grow (Or Else)
description=An hour-long Factorio roguelite. The Company drops you on a tiny island with a Shipping Terminal and a quota. Every shift the clock runs and the quota climbs. Between shifts: rule-bending contracts, instant tech, drop-pod supplies and new land rising out of the sea. Gremlins, earthquakes, meteors, strikes and, at the end, The Audit.\n[font=default-bold]First time? Pick Simple mode on the setup screen.[/font]
