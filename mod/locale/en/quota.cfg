[mod-setting-description]
quota-mode=Simple: the classic hour, every tech for sale. Complex: 10 shifts, deep production chains pay much more, and tech tiers need land (zoning). First time? Play Simple. Run Setup asks again at the start of every run.
quota-difficulty=Intern: gentle quotas, two warnings. Associate: the intended experience. Crunch Time: brutal quotas, no warnings.
quota-shifts=Shifts until The Audit. Auto: 8 in Simple, 10 in Complex.
quota-warnings=Missed quotas you survive. Auto: set by difficulty.
quota-quota-scale=Multiplies every quota on top of the difficulty.
quota-shift-length=Multiplies every shift's length.
quota-break-length=Seconds between shifts to shop and rebuild.
quota-hud-position=Where the shift timer and quota panel sit on your screen.
quota-s-meteors=Meteor Shower condition and stray meteors. Takes effect from the next shift.
quota-s-gremlins=Gremlin Infestation condition and stray gremlins. Takes effect from the next shift.
quota-s-raids=Hostile Takeover condition and surprise biter raids.
quota-s-nests=Biter nests on Infested Swamp plots (applies to land that rises after the change).
quota-s-audit=The final-shift boss. Off: the last shift is just a big quota.

